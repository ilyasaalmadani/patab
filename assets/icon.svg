<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PATAB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722" />
      <stop offset="0.55" stop-color="#0a0d14" />
      <stop offset="1" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#c9f24d" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#c9f24d" stop-opacity="0.04" />
      <stop offset="1" stop-color="#c9f24d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddff7a" />
      <stop offset="1" stop-color="#b5e52f" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe5ee" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="512" height="512" rx="116" fill="url(#glow)" />
  <circle cx="132" cy="112" r="92" fill="#c9f24d" opacity="0.16" filter="url(#soft)" />

  <g filter="url(#lift)">
    <rect x="86" y="86" width="148" height="148" rx="38" fill="url(#paper)" opacity="0.94" />
    <rect x="278" y="86" width="148" height="148" rx="38" fill="url(#lime)" />
    <rect x="86" y="278" width="148" height="148" rx="38" fill="url(#paper)" opacity="0.5" />
    <rect x="278" y="278" width="148" height="148" rx="38" fill="url(#paper)" opacity="0.24" />
  </g>

  <rect x="86" y="86" width="148" height="148" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.16" />
  <rect x="278" y="278" width="148" height="148" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.12" />
  <path d="M316 352h72" stroke="#ffffff" stroke-opacity="0.32" stroke-width="10" stroke-linecap="round" />
  <path d="M316 380h44" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round" />
</svg>
